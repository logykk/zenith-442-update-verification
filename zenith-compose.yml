x-zenith:
  catalog:
    name: Gatus
    description: Watch your websites, APIs, and services and publish a live status page. Set response-time and status-code conditions, get alerted the moment a check fails, and show customers exactly what's up.
    alternatives: [UptimeRobot, Statuspage, Pingdom, "Better Stack"]
    authors:
      - TwiN
    tags: [monitoring, status-page, uptime, health-checks, alerts, devops]
    source: "https://github.com/TwiN/gatus"
    website: "https://gatus.io"
    funding: "https://github.com/sponsors/TwiN"
    license: Apache-2.0
  expose:
    # gatus.<deployment>.zenith.hosting -> the dashboard + status page on 8080.
    - { service: gatus, port: 8080, web: true }
  storage:
    data:
      volume: gatus_data
      label: Monitor history
      # Internal state (SQLite): monitored-endpoint results and uptime history.
      # Not customer-managed files, so it stays a bare PVC (no file manager).
      description: SQLite database of endpoint check results and uptime history.

networks:
  gatus:
    external: false

services:
  # Gatus runs from scratch without a shell. Inline Compose configs deliver
  # /config/config.yaml as a read-only ConfigMap file; no boot wrapper is needed.
  # SQLite history stays on the separate data volume.
  gatus:
    image: ghcr.io/twin/gatus:v5.36.0
    container_name: gatus
    environment:
      - GATUS_CONFIG_PATH=/config/config.yaml
      - GATUS_LOG_LEVEL=INFO
      - PORT=8080
    configs:
      - source: gatus-config
        target: /config/config.yaml
    volumes:
      - gatus_data:/data
    restart: always
    networks:
      - gatus
    ports:
      - "8080:8080"

configs:
  gatus-config:
    content: |
      storage:
        type: sqlite
        path: /data/data.db

      endpoints:
        - name: cloudflare
          group: external
          url: "https://www.cloudflare.com"
          interval: 60s
          conditions:
            - "[STATUS] == 200"
            - "[RESPONSE_TIME] < 1500"

        - name: github-api
          group: external
          url: "https://api.github.com"
          interval: 60s
          conditions:
            - "[STATUS] == 200"
            - "[RESPONSE_TIME] < 1500"

        - name: google
          group: external
          url: "https://www.google.com"
          interval: 60s
          conditions:
            - "[STATUS] == 200"
            - "[RESPONSE_TIME] < 1500"

volumes:
  gatus_data:
